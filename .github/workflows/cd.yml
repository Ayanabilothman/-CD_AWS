name: Render Deploy

on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main

jobs:
  #1 login docker, build image, push image
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Login in to Docker
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nestjs-app:${{github.event.workflow_run.head_sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: config & deploy to EC2
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: copy config files
        uses: appleboy/scp-action@v1
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_PRIVATE_KEY}}
          source: 'docker-compose.yml,nginx/*'
          target: '/home/ubuntu/app'

      - name: deploy through ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_PRIVATE_KEY}}
          script: |
            cd '/home/ubuntu/app'

            cat << 'EOF' > .env
            MONGO_URI=${{secrets.MONGO_URI}}
            PORT=${{secrets.PORT}}
            EOF

            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -af
